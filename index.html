<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EMS判定">
<title>EMS / ゆうパック 搭載判定</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
:root{
  --bg:#0a0a1a;--panel:#1a1a3a;--bd:#4444aa;--bdl:#6666cc;
  --gold:#ffcc00;--wh:#eeeeff;--blue:#4488ff;
  --green:#44cc44;--red:#ff4444;--orange:#ffaa00;--gray:#888899;
  --land:#44aaff;
  --st:env(safe-area-inset-top,44px);--sb:env(safe-area-inset-bottom,20px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--wh);min-height:100vh;min-height:-webkit-fill-available;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(1px 1px at 15% 10%,rgba(255,255,255,.5) 0%,transparent 100%),radial-gradient(1px 1px at 60% 20%,rgba(255,255,255,.3) 0%,transparent 100%),radial-gradient(1px 1px at 85% 8%,rgba(255,255,255,.4) 0%,transparent 100%),radial-gradient(1px 1px at 40% 4%,rgba(255,255,255,.3) 0%,transparent 100%),radial-gradient(1px 1px at 90% 35%,rgba(255,255,255,.3) 0%,transparent 100%),radial-gradient(1px 1px at 8% 55%,rgba(255,255,255,.2) 0%,transparent 100%);pointer-events:none;z-index:0;}

#op{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;cursor:pointer;}
.op-logo{font-size:11px;font-weight:900;color:var(--gold);letter-spacing:.15em;margin-bottom:6px;opacity:0;animation:fu .8s ease .3s forwards;}
.op-sprite{font-size:56px;margin:18px 0 12px;opacity:0;animation:fu .8s ease .5s forwards;}
.op-title{font-size:19px;font-weight:900;color:var(--wh);text-align:center;line-height:1.5;opacity:0;animation:fu .8s ease .7s forwards;}
.op-title span{color:var(--gold);}
.op-sub{font-size:10px;color:var(--gray);margin-top:5px;letter-spacing:.08em;opacity:0;animation:fu .8s ease .9s forwards;}
.op-press{font-size:13px;color:var(--gold);letter-spacing:.15em;margin-top:44px;opacity:0;animation:fu .5s ease 1.5s forwards,blink 1.2s ease 2s infinite;}

#main{display:none;flex-direction:column;padding-top:calc(var(--st)+8px);padding-bottom:calc(var(--sb)+16px);padding-left:14px;padding-right:14px;position:relative;z-index:1;gap:10px;}

.W{background:var(--panel);border:3px solid var(--bdl);border-radius:4px;box-shadow:inset 0 0 0 1px var(--bd),0 4px 20px rgba(0,0,80,.5);position:relative;}
.W::before{content:'';position:absolute;inset:2px;border:1px solid rgba(100,100,200,.25);border-radius:2px;pointer-events:none;}

.hdr{padding:10px 14px;}
.hdr-logo{font-size:10px;color:var(--gold);letter-spacing:.15em;font-weight:700;margin-bottom:2px;}
.hdr-title{font-size:15px;font-weight:900;color:var(--wh);}

.legend{padding:8px 14px;display:flex;gap:8px;flex-wrap:wrap;}
.leg{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--gray);}
.leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.lg-ok{background:var(--green);}.lg-c{background:var(--orange);}.lg-l{background:var(--land);}.lg-ng{background:var(--red);}

.sw{padding:12px 14px;}
.sw-lbl{font-size:10px;color:var(--gold);letter-spacing:.15em;display:block;margin-bottom:7px;}
.sw-row{display:flex;gap:7px;}
.si{flex:1;background:#080818;border:2px solid var(--bd);border-radius:3px;color:var(--wh);font-family:'Noto Sans JP',sans-serif;font-size:15px;padding:9px 11px;outline:none;-webkit-appearance:none;}
.si::placeholder{color:var(--gray);font-size:13px;}
.si:focus{border-color:var(--gold);}
.sb{background:linear-gradient(180deg,#5566ee 0%,#3344bb 100%);border:2px solid var(--bdl);border-radius:3px;color:var(--wh);font-family:'Noto Sans JP',sans-serif;font-size:13px;font-weight:700;padding:9px 13px;cursor:pointer;box-shadow:0 3px 0 #223399,inset 0 1px 0 rgba(255,255,255,.15);-webkit-appearance:none;white-space:nowrap;}
.sb:active{transform:translateY(2px);box-shadow:0 1px 0 #223399;}

.tw{padding:10px 14px;}
.tw-lbl{font-size:10px;color:var(--gold);letter-spacing:.15em;display:block;margin-bottom:7px;}
.tg{display:flex;flex-wrap:wrap;gap:5px;}
.tb{background:#080818;border:1.5px solid var(--bd);border-radius:3px;color:var(--wh);font-family:'Noto Sans JP',sans-serif;font-size:11px;padding:5px 9px;cursor:pointer;-webkit-appearance:none;}
.tb:active{background:var(--panel);border-color:var(--gold);color:var(--gold);}

.em{padding:36px 14px;text-align:center;color:var(--gray);font-size:13px;line-height:2;}
.ei{font-size:30px;display:block;margin-bottom:10px;}

.rc{overflow:hidden;}
.sh{padding:12px 14px;display:flex;align-items:center;gap:10px;}
.sic{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;flex-shrink:0;border:2px solid;}
.ok   .sic{background:rgba(68,204,68,.12); border-color:var(--green); color:var(--green);}
.cond .sic{background:rgba(255,170,0,.12); border-color:var(--orange);color:var(--orange);}
.land .sic{background:rgba(68,170,255,.12);border-color:var(--land);  color:var(--land);}
.ng   .sic{background:rgba(255,68,68,.12); border-color:var(--red);   color:var(--red);}
.sn{font-size:13px;font-weight:700;color:var(--wh);line-height:1.4;flex:1;}
.badge{font-size:10px;padding:3px 8px;border-radius:2px;font-weight:700;border:1.5px solid;white-space:nowrap;flex-shrink:0;}
.ok   .badge{color:var(--green); border-color:var(--green);}
.cond .badge{color:var(--orange);border-color:var(--orange);}
.land .badge{color:var(--land);  border-color:var(--land);}
.ng   .badge{color:var(--red);   border-color:var(--red);}

.rb{padding:0 14px 14px;}
.smry{font-size:12px;color:#aaaacc;line-height:1.8;margin-bottom:12px;padding:9px 11px;background:rgba(0,0,0,.3);border-left:3px solid var(--bd);border-radius:0 3px 3px 0;}
.stitle{font-size:10px;color:var(--gold);letter-spacing:.15em;font-weight:700;margin:12px 0 7px;}

.verdict-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:2px;}
.verdict-box{border-radius:3px;padding:9px 10px;text-align:center;}
.verdict-box .vt{font-size:10px;font-weight:700;letter-spacing:.08em;margin-bottom:4px;}
.verdict-box .vi{font-size:18px;font-weight:900;line-height:1;}
.verdict-box .vl{font-size:10px;margin-top:3px;line-height:1.4;}
.vair-ok {background:rgba(68,204,68,.1); border:1.5px solid rgba(68,204,68,.4);}  .vair-ok .vt,.vair-ok .vi{color:var(--green);}
.vair-c  {background:rgba(255,170,0,.1); border:1.5px solid rgba(255,170,0,.4);}  .vair-c  .vt,.vair-c  .vi{color:var(--orange);}
.vair-ng {background:rgba(255,68,68,.1); border:1.5px solid rgba(255,68,68,.4);}  .vair-ng .vt,.vair-ng .vi{color:var(--red);}
.vland-ok{background:rgba(68,170,255,.1);border:1.5px solid rgba(68,170,255,.4);} .vland-ok .vt,.vland-ok .vi{color:var(--land);}
.vland-c {background:rgba(255,170,0,.1); border:1.5px solid rgba(255,170,0,.4);}  .vland-c  .vt{color:var(--orange);}
.vland-ng{background:rgba(255,68,68,.1); border:1.5px solid rgba(255,68,68,.4);}  .vland-ng .vt,.vland-ng .vi{color:var(--red);}
.vland-na{background:rgba(136,136,153,.08);border:1.5px solid rgba(136,136,153,.25);} .vland-na .vt,.vland-na .vi{color:var(--gray);}

.land-note{background:rgba(68,170,255,.08);border:1.5px solid rgba(68,170,255,.3);border-radius:3px;padding:9px 11px;font-size:12px;color:#88ccff;line-height:1.7;margin-bottom:4px;}
.cl{list-style:none;}
.cl li{font-size:12px;color:#aaaacc;padding:5px 0;border-bottom:1px solid rgba(68,68,170,.2);display:flex;gap:7px;align-items:flex-start;line-height:1.6;}
.cl li:last-child{border-bottom:none;}
.ci{flex-shrink:0;font-size:11px;margin-top:2px;}
.safe-box{background:rgba(68,204,68,.08);border:1.5px solid rgba(68,204,68,.3);border-radius:3px;padding:9px 11px;font-size:12px;color:#88ee88;line-height:1.7;}
.ng-box  {background:rgba(255,68,68,.08); border:1.5px solid rgba(255,68,68,.3); border-radius:3px;padding:9px 11px;font-size:12px;color:#ff8888;line-height:1.7;}
.dl{display:flex;flex-direction:column;gap:7px;}
.di{background:rgba(0,0,0,.4);border:1.5px solid rgba(68,68,170,.35);border-radius:3px;padding:9px 11px;}
.dtag{font-size:10px;color:var(--gold);margin-bottom:5px;display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;}
.dlabel{flex:1;min-width:0;}
.cpb{background:transparent;border:1px solid var(--bd);border-radius:2px;color:var(--gray);font-family:'Noto Sans JP',sans-serif;font-size:10px;padding:2px 7px;cursor:pointer;-webkit-appearance:none;white-space:nowrap;flex-shrink:0;}
.cpb:active,.cpb.copied{border-color:var(--green);color:var(--green);}
.den{font-size:12px;color:var(--blue);line-height:1.7;font-weight:700;margin-bottom:4px;word-break:break-all;}
.den.hl{color:var(--gold);font-size:13px;}
.dja{font-size:11px;color:var(--gray);line-height:1.6;}
.dpv{font-size:10px;color:#aaaaee;margin-top:4px;padding:4px 7px;background:rgba(68,68,170,.15);border-radius:2px;line-height:1.5;}
.official-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;padding:12px 14px;background:linear-gradient(180deg,#223388 0%,#111a55 100%);border:2px solid var(--bdl);border-radius:3px;color:var(--gold);font-family:'Noto Sans JP',sans-serif;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;box-shadow:0 3px 0 #0a0f33,inset 0 1px 0 rgba(255,255,255,.1);}
.official-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0a0f33;}
.official-note{font-size:10px;color:var(--gray);text-align:center;margin-top:6px;line-height:1.6;}

@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes si{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.slide-in{animation:si .25s ease forwards;}
</style>
</head>
<body>
<div id="op" onclick="startApp()">
  <div class="op-logo">JAPAN POST 公式一覧表（2025年2月版）準拠</div>
  <div class="op-sprite">✉️</div>

<div id="main">
  <div class="hdr W">
    <div class="hdr-logo">✉ JAPAN POST 公式一覧表（2025年2月）準拠</div>

  <div class="tw W">

</div>

// ===== い行 =====
{k:['衣類','服','洋服','tシャツ','ジャケット','ズボン','靴下','下着','衣料'],

// タグ
const TAGS=['香水','整髪料','化粧水','化粧品','アイメイク','シャンプー','アルコール','接着剤','マウスウォッシュ','ハンドクリーム','スプレー','リチウム電池','乾電池','ニッケル水素','モバイルバッテリー','カメラ','スマホ','パソコン','ランタン','ダイビング','ゲーム機','アイロン','ヘアアイロン','ドローン','体温計','カイロ','テント','食品','医薬品','マニキュア','たばこ','ライター','ガス缶','花火','農薬','灯油'];

const tg=document.getElementById('tg');
TAGS.forEach(t=>{const b=document.createElement('button');b.className='tb';b.textContent=t;b.onclick=()=>quickSearch(t);tg.appendChild(b);});

function findItem(q){
  const s=q.toLowerCase().replace(/[\s　]/g,'');
  let f=DB.find(i=>i.k.some(k=>s===k.toLowerCase().replace(/\s/g,'')));
  if(!f)f=DB.find(i=>i.k.some(k=>s.includes(k.toLowerCase().replace(/\s/g,''))||k.toLowerCase().replace(/\s/g,'').includes(s)));
  return f;
}

let ac=null;
function ga(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();return ac;}
function pOpen(){try{const c=ga();[523,659,784,1047].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;o.type='square';g.gain.setValueAtTime(.06,c.currentTime+i*.1);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+i*.1+.15);o.start(c.currentTime+i*.1);o.stop(c.currentTime+i*.1+.15);});}catch(e){}}
function pOK(){try{const c=ga();[660,880].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;o.type='square';g.gain.setValueAtTime(.05,c.currentTime+i*.1);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+i*.1+.12);o.start(c.currentTime+i*.1);o.stop(c.currentTime+i*.1+.12);});}catch(e){}}
function pNG(){try{const c=ga();[220,180].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;o.type='sawtooth';g.gain.setValueAtTime(.05,c.currentTime+i*.12);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+i*.12+.2);o.start(c.currentTime+i*.12);o.stop(c.currentTime+i*.12+.2);});}catch(e){}}
function pCond(){try{const c=ga();const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.setValueAtTime(660,c.currentTime);o.frequency.setValueAtTime(550,c.currentTime+.1);o.type='square';g.gain.setValueAtTime(.05,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.25);o.start(c.currentTime);o.stop(c.currentTime+.25);}catch(e){}}
function pLand(){try{const c=ga();[440,550,660].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;o.type='square';g.gain.setValueAtTime(.04,c.currentTime+i*.08);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+i*.08+.1);o.start(c.currentTime+i*.08);o.stop(c.currentTime+i*.08+.1);});}catch(e){}}

function startApp(){pOpen();document.getElementById('op').style.display='none';document.getElementById('main').style.display='flex';}
function doSearch(){const q=document.getElementById('query').value.trim();if(!q)return;const item=findItem(q);if(item){const a=item.air,l=item.land;if(a==='ok'&&l==='ok')pOK();else if(a==='ng'&&l==='ng')pNG();else if(a==='ng'&&l==='ok')pLand();else pCond();}else pNG();render(item,q);}
function quickSearch(w){document.getElementById('query').value=w;doSearch();}
function copyText(text,btn){const done=()=>{const o=btn.textContent;btn.textContent='コピー済み ✓';btn.classList.add('copied');setTimeout(()=>{btn.textContent=o;btn.classList.remove('copied');},2000);};if(navigator.clipboard){navigator.clipboard.writeText(text).then(done).catch(()=>{fb();done();});}else{fb();done();}function fb(){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);}}

function verdictHtml(item){
  const ai={ok:'◎',cond:'△',ng:'✗'},al={ok:'航空搭載可',cond:'条件付き可',ng:'航空搭載不可'},ac_={ok:'vair-ok',cond:'vair-c',ng:'vair-ng'};
  const li={ok:'◎',cond:'△',ng:'✗',na:'—'},ll={ok:'陸送引受可',cond:'条件付き可',ng:'陸送も不可',na:'要確認'},lc={ok:'vland-ok',cond:'vland-c',ng:'vland-ng',na:'vland-na'};
  return `<div class="verdict-row"><div class="verdict-box ${ac_[item.air]}"><div class="vt">✈ EMS・航空便</div><div class="vi">${ai[item.air]}</div><div class="vl">${al[item.air]}</div></div><div class="verdict-box ${lc[item.land]}"><div class="vt">🚚 ゆうパック陸送</div><div class="vi">${li[item.land]}</div><div class="vl">${ll[item.land]}</div></div></div>`;
}
function officialBtn(){return `<a href="https://www.post.japanpost.jp/question/dangerous_goods_search/" target="_blank" rel="noopener" class="official-btn">🏣 日本郵便 公式サイトで詳細確認 ↗</a><p class="official-note">品名を検索すると公式の判定結果・詳細条件を確認できます</p>`;}
function cardClass(item){if(item.air==='ok')return 'ok';if(item.air==='cond')return 'cond';if(item.air==='ng'&&item.land==='ok')return 'land';return 'ng';}

function render(item,query){
  const ra=document.getElementById('ra');
  if(!item){
    ra.innerHTML=`<div class="W slide-in" style="overflow:hidden;"><div class="sh" style="background:rgba(255,170,0,.06);"><div class="sic" style="background:rgba(255,170,0,.12);border-color:var(--orange);color:var(--orange);">?</div><div class="sn">「${query}」</div><div class="badge" style="color:var(--orange);border-color:var(--orange);">要確認</div></div><div class="rb"><div class="smry">「${query}」はアプリ内にデータがありません。<br>日本郵便の公式サイトで直接ご確認ください。</div><div class="stitle">◆ 公式サイトで品名を検索</div>${officialBtn()}</div></div>`;
    ra.scrollIntoView({behavior:'smooth',block:'start'});return;
  }
  const cc=cardClass(item);
  const safeHtml=item.sf?`<div class="safe-box">✓ ${item.sf}</div>`:`<div class="ng-box">✗ この品目は航空便・陸送ともに引受不可です。</div>`;
  const landNoteHtml=item.landNote?`<div class="land-note">🚚 ${item.landNote}</div>`:'';
  const checks=item.c.map(c=>`<li><span class="ci" style="color:${c.o?'#44cc44':'#ff4444'}">${c.o?'◎':'×'}</span><span>${c.t}</span></li>`).join('');
  const declsHtml=item.d.map(d=>`<div class="di"><div class="dtag"><span class="dlabel">${d.l}</span><button class="cpb" onclick="copyText('${d.en.replace(/'/g,"\\'")}',this)">コピー</button></div><div class="den${d.hl?' hl':''}">${d.en}</div><div class="dja">${d.ja}</div>${d.pv?`<div class="dpv">📌 ${d.pv}</div>`:''}</div>`).join('');
  ra.innerHTML=`<div class="rc W ${cc} slide-in"><div class="sh"><div class="sic">${cc==='ok'?'◎':cc==='cond'?'!':cc==='land'?'🚚':'✗'}</div><div class="sn">${item.n}</div><div class="badge">${item.lb}</div></div><div class="rb"><div class="smry">${item.sm}</div><div class="stitle">◆ 航空便 ／ ゆうパック陸送 判定</div>${verdictHtml(item)}${landNoteHtml}<div class="stitle">◆ 搭載条件・注意事項</div><ul class="cl">${checks}</ul><div class="stitle">◆ 搭載可否の目安</div>${safeHtml}<div class="stitle">◆ 品名欄・申告書の記載例（英語）</div><div class="dl">${declsHtml}</div><div class="stitle">◆ 公式情報で最終確認</div>${officialBtn()}</div></div>`;
  ra.scrollIntoView({behavior:'smooth',block:'start'});
}
document.getElementById('query').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doSearch();}});
</script>
